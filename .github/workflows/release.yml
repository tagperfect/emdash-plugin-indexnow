name: Release

# Push a tag `v<version>` matching package.json to build, test and publish.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (version from packageManager)
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  # The peer range promises EmDash >=1.0.1: run the tests against the oldest and each minor release.
  compat:
    name: Test with EmDash ${{ matrix.emdash }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { emdash: 1.0.1, plugin-test: 0.2.6 }
          - { emdash: 1.1.0, plugin-test: 0.2.7 }
          - { emdash: 1.2.0, plugin-test: 0.2.8 }
          - { emdash: 1.3.0, plugin-test: 0.2.9 }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm add -D emdash@${{ matrix.emdash }} @emdash-cms/blocks@${{ matrix.emdash }} @emdash-cms/plugin-test@${{ matrix.plugin-test }}
      - run: pnpm run typecheck
      - run: pnpm test

  npm:
    name: Publish to npm
    needs: [build, compat]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance; no NPM_TOKEN
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # npm >= 11.5.1 exchanges the GitHub OIDC token for a short-lived publish token.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --provenance --access public

  # EmDash plugin registry. Off by default: set the repository variable
  # EMDASH_REGISTRY_RELEASE=true after the publisher DID is in emdash-plugin.jsonc
  # and the repository is approved in the EmDash release dashboard.
  # Mirrors the workflow generated by `emdash-plugin release setup` (plugin-cli 0.13.4).
  registry:
    name: Publish to the EmDash registry
    needs: build
    if: ${{ vars.EMDASH_REGISTRY_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # audience-bound GitHub OIDC token for the release service
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare plugin release
        id: prepare
        env:
          SELECTOR: indexnow@${{ needs.build.outputs.version }}
        run: pnpm dlx @emdash-cms/plugin-cli@0.13.4 release prepare "${SELECTOR}" --dir . --out-dir .emdash-release
      - name: Create build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}
      - name: Publish plugin
        # Candidate from emdash-cms/emdash#4467 (uploads release.artifacts media); back to @main after merge.
        uses: emdash-cms/emdash/apps/release-action@45b542c016d35c7a88a590dce8e600e2384c13a9
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          bundle-file: ${{ steps.prepare.outputs.bundle-file }}
          provenance-file: ${{ steps.attest.outputs.bundle-path }}
